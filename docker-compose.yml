version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: georgeg80m3
      POSTGRES_DB: aria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aria-rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ API port
      - "15672:15672" # Management UI dashboard
    environment:
      RABBITMQ_DEFAULT_USER: aria
      RABBITMQ_DEFAULT_PASS: aria

  minio:
    image: minio/minio
    container_name: aria-minio
    ports:
      - "9000:9000"   # MinIO API port (your app needs this)
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aria-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
    name: aria_qdrant_data
    external: true




